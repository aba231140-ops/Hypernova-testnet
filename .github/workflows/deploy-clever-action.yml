
name: Deploy HYPERNOVA Edge Function

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/clever-action/**"
      - ".github/workflows/deploy-clever-action.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy clever-action
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy clever-action --project-ref knoenrgxdegsqmhlxobx --yes
        
